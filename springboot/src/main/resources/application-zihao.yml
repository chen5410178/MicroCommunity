server:
  port: 8008
  tomcat:
    uri-encoding: UTF-8



spring:
  servlet:
    multipart:
      maxFileSize: 50MB
      maxRequestSize: 50MB
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  application:
    name: community-service
  redis:
    database: 8
    host: dev.redis.java110.com
    port: 6379
    password: ${redispwd}
    pool:
      max-active: 300
      max-wait: 10000
      max-idle: 100
      min-idle: 0
      timeout: 0
  activiti:
    database-schema-update: false
  datasource:
    url: jdbc:mysql://dev.db.java110.com:3306/TT_v2?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: TT_v2
    password: ${mysqlpwd}
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      max-active: 10
      min-idle: 5
      max-wait: 60000

feign:
  client:
    config:
      default:
        connect-timeout: 10000
        read-timeout: 20000

