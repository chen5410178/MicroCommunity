<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <link rel="stylesheet" href="/formjs/css/form-js.css">
  <link href="/font-awesome/css/font-awesome.css" rel="stylesheet" />

  <title><%= htmlWebpackPlugin.options.title %></title>
  <style>
    /* 首屏引导占位：语言包/主包加载期间可见，Vue 挂载后自动被替换 */
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
    }
    #app-loading .app-loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e4e7ed;
      border-top-color: #409eff;
      border-radius: 50%;
      animation: app-loading-rotate 0.8s linear infinite;
    }
    @keyframes app-loading-rotate {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <!-- 全局脚本引入 -->
  <script>
    // 脚本加载错误处理
    window.scriptLoadErrors = [];
    
    function handleScriptError(scriptName, error) {
      console.error('脚本加载失败:', scriptName, error);
      window.scriptLoadErrors.push({ name: scriptName, error: error.message });
    }
  </script>
  <script src="https://map.qq.com/api/gljs?v=1.exp&key="></script>

  <!-- Qs 库 - 主 CDN -->
  <script src="/js/jessibuca/jessibuca.js"></script>
  <script src="/formjs/js/form-viewer.umd.js"></script>


  
  <!-- 可以在这里添加更多全局脚本 -->
</head>
<body>
  <noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
  </noscript>
  <div id="app">
    <div id="app-loading">
      <div class="app-loading-spinner"></div>
    </div>
  </div>
  <!-- built files will be auto injected -->
</body>

</html>
